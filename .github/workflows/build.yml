name: Build Cart Bind JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          mkdir -p src/main/java/com/ahmad/cartbind/config
          mkdir -p src/main/java/com/ahmad/cartbind/util
          mkdir -p src/main/resources/assets/cartbind/lang

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'cart-bind'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.6
          loader_version=0.18.4
          loom_version=1.14.10
          fabric_version=0.141.6+1.21.11
          modmenu_version=17.0.1
          mod_version=1.0.0
          maven_group=com.ahmad.cartbind
          archives_base_name=CartBind
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = "${project.mod_version}+mc${project.minecraft_version}"
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
              maven {
                  name = "TerraformersMC"
                  url = "https://maven.terraformersmc.com/releases/"
              }
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
              modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
              modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "cartbind",
            "version": "${version}",
            "name": "Cart Bind",
            "description": "Lightweight PvP utility mod that automatically places a Rail (when needed) and one TNT Minecart with a single configurable keybind. Credit: Ahmad.",
            "authors": ["Ahmad"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.ahmad.cartbind.CartBindClient"],
              "modmenu": ["com.ahmad.cartbind.config.ModMenuIntegration"]
            },
            "depends": {
              "fabricloader": "*",
              "minecraft": "=1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            },
            "suggests": {
              "modmenu": "*"
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/cartbind/lang/en_us.json
          {
            "key.category.cartbind.general": "Cart Bind",
            "key.cartbind.place_cart": "Cart Bind: Auto Rail + TNT Minecart",
            "text.cartbind.no_rail": "No Rail!",
            "text.cartbind.no_tnt_minecart": "No TNT Minecart!",
            "screen.cartbind.config.title": "Cart Bind",
            "screen.cartbind.config.enabled_on": "Enable Mod: ON",
            "screen.cartbind.config.enabled_off": "Enable Mod: OFF",
            "screen.cartbind.config.placement_speed": "Placement Speed: %s s",
            "screen.cartbind.config.rail_pref_standard": "Rail Preference: Standard Rail First",
            "screen.cartbind.config.rail_pref_any": "Rail Preference: Any Suitable Rail",
            "screen.cartbind.config.restore_slot_on": "Restore Previous Slot: ON",
            "screen.cartbind.config.restore_slot_off": "Restore Previous Slot: OFF",
            "screen.cartbind.config.open_controls": "Keybind (%s) - Open Controls...",
            "screen.cartbind.config.reset_defaults": "Reset Settings to Defaults",
            "screen.cartbind.config.credit": "Created by Ahmad | Minecraft 1.21.11"
          }
          EOF

          cat << 'EOF' > src/main/java/com/ahmad/cartbind/CartBindClient.java
          package com.ahmad.cartbind;

          import com.ahmad.cartbind.config.CartBindConfig;
          import com.ahmad.cartbind.util.CartPlacementController;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public final class CartBindClient implements ClientModInitializer {
              public static final String MOD_ID = "cartbind";
              public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);

              public static final KeyBinding.Category KEY_CATEGORY = KeyBinding.Category.create(
                      Identifier.of(MOD_ID, "general")
              );

              private static KeyBinding placeCartKeyBinding;
              private static boolean wasKeyHeld = false;

              @Override
              public void onInitializeClient() {
                  CartBindConfig.load();

                  placeCartKeyBinding = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.cartbind.place_cart",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_G,
                          KEY_CATEGORY
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (placeCartKeyBinding == null) {
                          return;
                      }

                      boolean pressedThisTick = false;
                      while (placeCartKeyBinding.wasPressed()) {
                          pressedThisTick = true;
                      }

                      boolean currentlyDown = placeCartKeyBinding.isPressed();

                      if (!CartBindConfig.isEnabled()) {
                          if (CartPlacementController.isRunning()) {
                              CartPlacementController.cancelAndReset(client);
                          }
                          wasKeyHeld = currentlyDown;
                          return;
                      }

                      if (CartPlacementController.isRunning()) {
                          CartPlacementController.tick(client);
                      }

                      if (pressedThisTick && !wasKeyHeld) {
                          wasKeyHeld = true;
                          if (client.currentScreen == null && !CartPlacementController.isRunning()) {
                              CartPlacementController.startSequence(client);
                          }
                      } else if (!currentlyDown) {
                          wasKeyHeld = false;
                      }
                  });

                  LOGGER.info("Cart Bind (1.21.11) initialized. Created by Ahmad.");
              }

              public static KeyBinding getPlaceCartKeyBinding() {
                  return placeCartKeyBinding;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/ahmad/cartbind/util/HotbarDetector.java
          package com.ahmad.cartbind.util;

          import com.ahmad.cartbind.config.CartBindConfig;
          import net.minecraft.entity.player.PlayerInventory;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;

          public final class HotbarDetector {

              public static final int HOTBAR_SIZE = 9;

              private HotbarDetector() {
              }

              public static boolean isSupportedRailItem(Item item) {
                  return item == Items.RAIL
                          || item == Items.POWERED_RAIL
                          || item == Items.DETECTOR_RAIL
                          || item == Items.ACTIVATOR_RAIL;
              }

              public static int findRailSlot(PlayerInventory inventory, boolean preferStandard) {
                  int currentSlot = inventory.getSelectedSlot();

                  if (preferStandard) {
                      if (PlayerInventory.isValidHotbarIndex(currentSlot)
                              && inventory.getStack(currentSlot).isOf(Items.RAIL)) {
                          return currentSlot;
                      }
                      for (int i = 0; i < HOTBAR_SIZE; i++) {
                          if (inventory.getStack(i).isOf(Items.RAIL)) {
                              return i;
                          }
                      }
                  }

                  if (PlayerInventory.isValidHotbarIndex(currentSlot)) {
                      ItemStack currentStack = inventory.getStack(currentSlot);
                      if (!currentStack.isEmpty() && isSupportedRailItem(currentStack.getItem())) {
                          return currentSlot;
                      }
                  }

                  for (int i = 0; i < HOTBAR_SIZE; i++) {
                      ItemStack stack = inventory.getStack(i);
                      if (!stack.isEmpty() && isSupportedRailItem(stack.getItem())) {
                          return i;
                      }
                  }

                  return -1;
              }

              public static int findRailSlot(PlayerInventory inventory) {
                  return findRailSlot(
                          inventory,
                          CartBindConfig.getRailPreference() == CartBindConfig.RailPreference.STANDARD_FIRST
                  );
              }

              public static int findTntMinecartSlot(PlayerInventory inventory) {
                  int currentSlot = inventory.getSelectedSlot();
                  if (PlayerInventory.isValidHotbarIndex(currentSlot)
                          && inventory.getStack(currentSlot).isOf(Items.TNT_MINECART)) {
                      return currentSlot;
                  }

                  for (int i = 0; i < HOTBAR_SIZE; i++) {
                      ItemStack stack = inventory.getStack(i);
                      if (!stack.isEmpty() && stack.isOf(Items.TNT_MINECART)) {
                          return i;
                      }
                  }

                  return -1;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/ahmad/cartbind/util/CartPlacementController.java
          package com.ahmad.cartbind.util;

          import com.ahmad.cartbind.config.CartBindConfig;
          import net.minecraft.block.AbstractRailBlock;
          import net.minecraft.block.BlockState;
          import net.minecraft.block.Blocks;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.network.ClientPlayerInteractionManager;
          import net.minecraft.client.world.ClientWorld;
          import net.minecraft.entity.player.PlayerInventory;
          import net.minecraft.item.ItemPlacementContext;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.network.packet.c2s.play.UpdateSelectedSlotC2SPacket;
          import net.minecraft.registry.tag.BlockTags;
          import net.minecraft.text.Text;
          import net.minecraft.util.ActionResult;
          import net.minecraft.util.Formatting;
          import net.minecraft.util.Hand;
          import net.minecraft.util.hit.BlockHitResult;
          import net.minecraft.util.hit.HitResult;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Direction;
          import net.minecraft.util.math.Vec3d;

          public final class CartPlacementController {

              public enum State {
                  IDLE,
                  VALIDATE,
                  FIND_RAIL,
                  PLACE_RAIL_IF_NEEDED,
                  WAIT_FOR_RAIL_CONFIRMATION,
                  FIND_TNT_MINECART,
                  PLACE_MINECART,
                  RESTORE_SLOT,
                  COMPLETE,
                  FAILED
              }

              private static final int RAIL_CONFIRM_TIMEOUT_TICKS = 15;

              private static final Text MSG_NO_RAIL = Text.translatable("text.cartbind.no_rail")
                      .formatted(Formatting.RED);
              private static final Text MSG_NO_TNT_MINECART = Text.translatable("text.cartbind.no_tnt_minecart")
                      .formatted(Formatting.RED);

              private static State currentState = State.IDLE;
              private static int savedOriginalSlot = -1;
              private static int detectedRailSlot = -1;
              private static int detectedCartSlot = -1;
              private static BlockHitResult initialBlockHit = null;
              private static BlockPos targetRailPos = null;
              private static boolean railAlreadyPresent = false;
              private static int delayTicksRemaining = 0;
              private static int confirmTimeoutTicks = 0;
              private static ClientWorld activeWorld = null;

              private CartPlacementController() {
              }

              public static boolean isRunning() {
                  return currentState != State.IDLE;
              }

              public static void startSequence(MinecraftClient client) {
                  if (currentState != State.IDLE) {
                      return;
                  }

                  currentState = State.VALIDATE;
                  processImmediateValidateAndStart(client);
              }

              private static void processImmediateValidateAndStart(MinecraftClient client) {
                  if (!isValidEnvironment(client)) {
                      resetToIdle();
                      return;
                  }

                  ClientPlayerEntity player = client.player;
                  ClientPlayerInteractionManager interactionManager = client.interactionManager;
                  ClientWorld world = client.world;
                  PlayerInventory inventory = player.getInventory();

                  HitResult hitResult = client.crosshairTarget;
                  if (!(hitResult instanceof BlockHitResult blockHit) || hitResult.getType() != HitResult.Type.BLOCK) {
                      resetToIdle();
                      return;
                  }

                  savedOriginalSlot = inventory.getSelectedSlot();
                  initialBlockHit = blockHit;
                  activeWorld = world;

                  int precheckCartSlot = HotbarDetector.findTntMinecartSlot(inventory);
                  if (precheckCartSlot == -1) {
                      player.sendMessage(MSG_NO_TNT_MINECART, true);
                      resetToIdle();
                      return;
                  }

                  BlockPos clickedPos = blockHit.getBlockPos();
                  BlockState clickedState = world.getBlockState(clickedPos);

                  if (isRailBlock(clickedState)) {
                      railAlreadyPresent = true;
                      targetRailPos = clickedPos.toImmutable();
                      currentState = State.FIND_TNT_MINECART;
                      delayTicksRemaining = computeStepDelayTicks(true);
                      return;
                  }

                  currentState = State.FIND_RAIL;
                  detectedRailSlot = HotbarDetector.findRailSlot(inventory);
                  if (detectedRailSlot == -1) {
                      player.sendMessage(MSG_NO_RAIL, true);
                      resetToIdle();
                      return;
                  }

                  currentState = State.PLACE_RAIL_IF_NEEDED;
                  ItemStack railStack = inventory.getStack(detectedRailSlot);
                  BlockPos placementPos = resolveValidRailPlacementPos(world, player, blockHit, railStack);
                  if (placementPos == null) {
                      resetToIdle();
                      return;
                  }

                  targetRailPos = placementPos.toImmutable();
                  railAlreadyPresent = false;

                  if (isRailBlock(world.getBlockState(targetRailPos))) {
                      railAlreadyPresent = true;
                      currentState = State.FIND_TNT_MINECART;
                      delayTicksRemaining = computeStepDelayTicks(true);
                      return;
                  }

                  selectSlotAndSync(player, detectedRailSlot);

                  ActionResult placeResult = interactionManager.interactBlock(player, Hand.MAIN_HAND, blockHit);
                  if (!placeResult.isAccepted()) {
                      failAndCleanup(client);
                      return;
                  }

                  if (placeResult instanceof ActionResult.Success success && success.swingSource() == ActionResult.SwingSource.CLIENT) {
                      player.swingHand(Hand.MAIN_HAND);
                  }

                  currentState = State.WAIT_FOR_RAIL_CONFIRMATION;
                  delayTicksRemaining = computeStepDelayTicks(false);
                  confirmTimeoutTicks = RAIL_CONFIRM_TIMEOUT_TICKS;
              }

              public static void tick(MinecraftClient client) {
                  if (currentState == State.IDLE) {
                      return;
                  }

                  if (!isValidEnvironment(client) || client.world != activeWorld || targetRailPos == null) {
                      cancelAndReset(client);
                      return;
                  }

                  ClientPlayerEntity player = client.player;
                  ClientPlayerInteractionManager interactionManager = client.interactionManager;
                  ClientWorld world = client.world;
                  PlayerInventory inventory = player.getInventory();

                  if (player.squaredDistanceTo(Vec3d.ofCenter(targetRailPos)) > 36.0D) {
                      failAndCleanup(client);
                      return;
                  }

                  switch (currentState) {
                      case WAIT_FOR_RAIL_CONFIRMATION -> {
                          if (delayTicksRemaining > 0) {
                              delayTicksRemaining--;
                          }

                          BlockState stateAtTarget = world.getBlockState(targetRailPos);
                          if (isRailBlock(stateAtTarget)) {
                              if (delayTicksRemaining <= 0) {
                                  currentState = State.FIND_TNT_MINECART;
                              }
                          } else {
                              confirmTimeoutTicks--;
                              if (confirmTimeoutTicks <= 0) {
                                  failAndCleanup(client);
                              }
                          }
                      }

                      case FIND_TNT_MINECART -> {
                          if (delayTicksRemaining > 0) {
                              delayTicksRemaining--;
                              return;
                          }

                          if (!isRailBlock(world.getBlockState(targetRailPos))) {
                              failAndCleanup(client);
                              return;
                          }

                          detectedCartSlot = HotbarDetector.findTntMinecartSlot(inventory);
                          if (detectedCartSlot == -1) {
                              player.sendMessage(MSG_NO_TNT_MINECART, true);
                              failAndCleanup(client);
                              return;
                          }

                          currentState = State.PLACE_MINECART;
                          executeMinecartPlacement(client, player, interactionManager, world, inventory);
                      }

                      case PLACE_MINECART -> {
                          executeMinecartPlacement(client, player, interactionManager, world, inventory);
                      }

                      case RESTORE_SLOT -> {
                          if (delayTicksRemaining > 0) {
                              delayTicksRemaining--;
                              return;
                          }
                          if (CartBindConfig.isRestorePreviousSlot()
                                  && PlayerInventory.isValidHotbarIndex(savedOriginalSlot)) {
                              selectSlotAndSync(player, savedOriginalSlot);
                          }
                          currentState = State.COMPLETE;
                          resetToIdle();
                      }

                      case COMPLETE, FAILED -> resetToIdle();

                      default -> resetToIdle();
                  }
              }

              private static void executeMinecartPlacement(
                      MinecraftClient client,
                      ClientPlayerEntity player,
                      ClientPlayerInteractionManager interactionManager,
                      ClientWorld world,
                      PlayerInventory inventory
              ) {
                  if (!isRailBlock(world.getBlockState(targetRailPos))) {
                      failAndCleanup(client);
                      return;
                  }

                  if (!PlayerInventory.isValidHotbarIndex(detectedCartSlot)
                          || !inventory.getStack(detectedCartSlot).isOf(Items.TNT_MINECART)) {
                      detectedCartSlot = HotbarDetector.findTntMinecartSlot(inventory);
                      if (detectedCartSlot == -1) {
                          player.sendMessage(MSG_NO_TNT_MINECART, true);
                          failAndCleanup(client);
                          return;
                      }
                  }

                  selectSlotAndSync(player, detectedCartSlot);

                  BlockHitResult railHit = createRailHitResult(targetRailPos);
                  ActionResult cartResult = interactionManager.interactBlock(player, Hand.MAIN_HAND, railHit);

                  if (!cartResult.isAccepted()) {
                      failAndCleanup(client);
                      return;
                  }

                  if (cartResult instanceof ActionResult.Success success && success.swingSource() == ActionResult.SwingSource.CLIENT) {
                      player.swingHand(Hand.MAIN_HAND);
                  }

                  if (CartBindConfig.isRestorePreviousSlot()) {
                      currentState = State.RESTORE_SLOT;
                      delayTicksRemaining = 1;
                  } else {
                      currentState = State.COMPLETE;
                      resetToIdle();
                  }
              }

              public static void cancelAndReset(MinecraftClient client) {
                  failAndCleanup(client);
              }

              private static void failAndCleanup(MinecraftClient client) {
                  currentState = State.FAILED;
                  if (CartBindConfig.isRestorePreviousSlot()
                          && client != null
                          && client.player != null
                          && PlayerInventory.isValidHotbarIndex(savedOriginalSlot)) {
                      selectSlotAndSync(client.player, savedOriginalSlot);
                  }
                  resetToIdle();
              }

              private static void resetToIdle() {
                  currentState = State.IDLE;
                  savedOriginalSlot = -1;
                  detectedRailSlot = -1;
                  detectedCartSlot = -1;
                  initialBlockHit = null;
                  targetRailPos = null;
                  railAlreadyPresent = false;
                  delayTicksRemaining = 0;
                  confirmTimeoutTicks = 0;
                  activeWorld = null;
              }

              private static int computeStepDelayTicks(boolean reusingExistingRail) {
                  double speedSeconds = CartBindConfig.getPlacementSpeedSeconds();
                  if (speedSeconds <= 0.15D) {
                      return reusingExistingRail ? 0 : 1;
                  }
                  int totalTicks = (int) Math.round(speedSeconds * 10.0D);
                  if (reusingExistingRail) {
                      return Math.max(1, totalTicks / 2);
                  }
                  return Math.max(1, totalTicks);
              }

              private static boolean isRailBlock(BlockState state) {
                  if (state == null) {
                      return false;
                  }
                  return AbstractRailBlock.isRail(state) || state.isIn(BlockTags.RAILS);
              }

              private static BlockPos resolveValidRailPlacementPos(
                      ClientWorld world,
                      ClientPlayerEntity player,
                      BlockHitResult blockHit,
                      ItemStack railStack
              ) {
                  ItemPlacementContext context = new ItemPlacementContext(player, Hand.MAIN_HAND, railStack, blockHit);
                  if (!context.canPlace()) {
                      return null;
                  }

                  BlockPos placementPos = context.getBlockPos();
                  if (!Blocks.RAIL.getDefaultState().canPlaceAt(world, placementPos)) {
                      return null;
                  }

                  return placementPos;
              }

              private static BlockHitResult createRailHitResult(BlockPos railPos) {
                  Vec3d hitVec = new Vec3d(
                          railPos.getX() + 0.5D,
                          railPos.getY() + 0.0625D,
                          railPos.getZ() + 0.5D
                  );
                  return new BlockHitResult(hitVec, Direction.UP, railPos, false);
              }

              private static void selectSlotAndSync(ClientPlayerEntity player, int slot) {
                  if (!PlayerInventory.isValidHotbarIndex(slot)) {
                      return;
                  }
                  PlayerInventory inventory = player.getInventory();
                  if (inventory.getSelectedSlot() != slot) {
                      inventory.setSelectedSlot(slot);
                      if (player.networkHandler != null) {
                          player.networkHandler.sendPacket(new UpdateSelectedSlotC2SPacket(slot));
                      }
                  }
              }

              private static boolean isValidEnvironment(MinecraftClient client) {
                  return client != null
                          && client.player != null
                          && client.world != null
                          && client.interactionManager != null
                          && client.currentScreen == null
                          && !client.player.isSpectator()
                          && !client.player.isDead()
                          && !client.player.isUsingItem();
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/ahmad/cartbind/config/CartBindConfig.java
          package com.ahmad.cartbind.config;

          import com.ahmad.cartbind.CartBindClient;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Locale;
          import java.util.Properties;

          public final class CartBindConfig {

              public enum RailPreference {
                  STANDARD_FIRST,
                  ANY_SUITABLE
              }

              private static final String CONFIG_FILE_NAME = "cartbind.properties";

              private static final String KEY_ENABLED = "enabled";
              private static final String KEY_PLACEMENT_SPEED = "placement_speed_seconds";
              private static final String KEY_RAIL_PREFERENCE = "rail_preference";
              private static final String KEY_RESTORE_SLOT = "restore_previous_slot";

              public static final double MIN_SPEED_SECONDS = 0.1D;
              public static final double MAX_SPEED_SECONDS = 2.0D;
              public static final double DEFAULT_SPEED_SECONDS = 1.0D;

              private static boolean enabled = true;
              private static double placementSpeedSeconds = DEFAULT_SPEED_SECONDS;
              private static RailPreference railPreference = RailPreference.STANDARD_FIRST;
              private static boolean restorePreviousSlot = true;

              private CartBindConfig() {
              }

              public static boolean isEnabled() {
                  return enabled;
              }

              public static void setEnabled(boolean value) {
                  enabled = value;
                  save();
              }

              public static void toggleEnabled() {
                  setEnabled(!enabled);
              }

              public static double getPlacementSpeedSeconds() {
                  return placementSpeedSeconds;
              }

              public static void setPlacementSpeedSeconds(double value) {
                  double clamped = Math.max(MIN_SPEED_SECONDS, Math.min(MAX_SPEED_SECONDS, value));
                  placementSpeedSeconds = Math.round(clamped * 10.0D) / 10.0D;
                  save();
              }

              public static RailPreference getRailPreference() {
                  return railPreference;
              }

              public static void toggleRailPreference() {
                  railPreference = (railPreference == RailPreference.STANDARD_FIRST)
                          ? RailPreference.ANY_SUITABLE
                          : RailPreference.STANDARD_FIRST;
                  save();
              }

              public static boolean isRestorePreviousSlot() {
                  return restorePreviousSlot;
              }

              public static void toggleRestorePreviousSlot() {
                  restorePreviousSlot = !restorePreviousSlot;
                  save();
              }

              public static void resetToDefaults() {
                  enabled = true;
                  placementSpeedSeconds = DEFAULT_SPEED_SECONDS;
                  railPreference = RailPreference.STANDARD_FIRST;
                  restorePreviousSlot = true;
                  save();
              }

              private static Path getConfigPath() {
                  return FabricLoader.getInstance().getConfigDir().resolve(CONFIG_FILE_NAME);
              }

              public static void load() {
                  Path path = getConfigPath();
                  if (!Files.exists(path)) {
                      save();
                      return;
                  }

                  Properties props = new Properties();
                  try (InputStream in = Files.newInputStream(path)) {
                      props.load(in);
                      enabled = parseBoolean(props.getProperty(KEY_ENABLED), true);
                      placementSpeedSeconds = parseDouble(
                              props.getProperty(KEY_PLACEMENT_SPEED),
                              DEFAULT_SPEED_SECONDS,
                              MIN_SPEED_SECONDS,
                              MAX_SPEED_SECONDS
                      );
                      railPreference = parseRailPreference(props.getProperty(KEY_RAIL_PREFERENCE));
                      restorePreviousSlot = parseBoolean(props.getProperty(KEY_RESTORE_SLOT), true);
                  } catch (IOException | IllegalArgumentException e) {
                      CartBindClient.LOGGER.warn("Failed to load {}; using defaults.", CONFIG_FILE_NAME, e);
                  }
              }

              public static void save() {
                  Path path = getConfigPath();
                  Properties props = new Properties();
                  props.setProperty(KEY_ENABLED, Boolean.toString(enabled));
                  props.setProperty(KEY_PLACEMENT_SPEED, String.format(Locale.ROOT, "%.1f", placementSpeedSeconds));
                  props.setProperty(KEY_RAIL_PREFERENCE, railPreference.name());
                  props.setProperty(KEY_RESTORE_SLOT, Boolean.toString(restorePreviousSlot));

                  try {
                      Files.createDirectories(path.getParent());
                      try (OutputStream out = Files.newOutputStream(path)) {
                          props.store(out, "Cart Bind Configuration (Minecraft 1.21.11) - Created by Ahmad");
                      }
                  } catch (IOException e) {
                      CartBindClient.LOGGER.warn("Failed to save {}.", CONFIG_FILE_NAME, e);
                  }
              }

              private static boolean parseBoolean(String raw, boolean fallback) {
                  if (raw == null) {
                      return fallback;
                  }
                  String trimmed = raw.trim();
                  if ("true".equalsIgnoreCase(trimmed)) {
                      return true;
                  }
                  if ("false".equalsIgnoreCase(trimmed)) {
                      return false;
                  }
                  return fallback;
              }

              private static double parseDouble(String raw, double fallback, double min, double max) {
                  if (raw == null) {
                      return fallback;
                  }
                  try {
                      double val = Double.parseDouble(raw.trim());
                      double clamped = Math.max(min, Math.min(max, val));
                      return Math.round(clamped * 10.0D) / 10.0D;
                  } catch (NumberFormatException e) {
                      return fallback;
                  }
              }

              private static RailPreference parseRailPreference(String raw) {
                  if (raw != null && "ANY_SUITABLE".equalsIgnoreCase(raw.trim())) {
                      return RailPreference.ANY_SUITABLE;
                  }
                  return RailPreference.STANDARD_FIRST;
              }
          }
