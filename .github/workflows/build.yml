          cat << 'EOF' > src/main/java/com/ahmad/anchorbind/config/AnchorBindConfigScreen.java
          package com.ahmad.anchorbind.config;

          import com.ahmad.anchorbind.AnchorBindClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.screen.option.KeybindsScreen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.SliderWidget;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.screen.ScreenTexts;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;

          import java.util.Locale;

          public final class AnchorBindConfigScreen extends Screen {
              private final Screen parent;

              public AnchorBindConfigScreen(Screen parent) {
                  super(Text.translatable("screen.anchorbind.config.title"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  int buttonWidth = 220;
                  int buttonHeight = 20;
                  int centerX = this.width / 2 - buttonWidth / 2;
                  int startY = this.height / 2 - 58;

                  this.addDrawableChild(ButtonWidget.builder(getEnabledText(), button -> {
                      AnchorBindConfig.toggleEnabled();
                      button.setMessage(getEnabledText());
                  }).dimensions(centerX, startY, buttonWidth, buttonHeight).build());

                  this.addDrawableChild(new ComboSpeedSlider(
                          centerX,
                          startY + 24,
                          buttonWidth,
                          buttonHeight,
                          AnchorBindConfig.getComboSpeedSeconds()
                  ));

                  this.addDrawableChild(ButtonWidget.builder(getGlowstoneCountText(), button -> {
                      AnchorBindConfig.cycleGlowstoneCount();
                      button.setMessage(getGlowstoneCountText());
                  }).dimensions(centerX, startY + 48, buttonWidth, buttonHeight).build());

                  this.addDrawableChild(ButtonWidget.builder(getRestoreSlotText(), button -> {
                      AnchorBindConfig.toggleRestorePreviousSlot();
                      button.setMessage(getRestoreSlotText());
                  }).dimensions(centerX, startY + 72, buttonWidth, buttonHeight).build());

                  KeyBinding kb = AnchorBindClient.getAnchorComboKeyBinding();
                  Text keyName = kb != null ? kb.getBoundKeyLocalizedText() : Text.literal("V");
                  this.addDrawableChild(ButtonWidget.builder(
                          Text.translatable("screen.anchorbind.config.open_controls", keyName),
                          button -> {
                              if (this.client != null) {
                                  this.client.setScreen(new KeybindsScreen(this, this.client.options));
                              }
                          }
                  ).dimensions(centerX, startY + 96, buttonWidth, buttonHeight).build());

                  this.addDrawableChild(ButtonWidget.builder(ScreenTexts.DONE, button -> close())
                          .dimensions(centerX, startY + 128, buttonWidth, buttonHeight)
                          .build());
              }

              private static Text getEnabledText() {
                  if (AnchorBindConfig.isEnabled()) {
                      return Text.translatable("screen.anchorbind.config.enabled_on").formatted(Formatting.GREEN);
                  }
                  return Text.translatable("screen.anchorbind.config.enabled_off").formatted(Formatting.RED);
              }

              private static Text getGlowstoneCountText() {
                  return Text.translatable(
                          "screen.anchorbind.config.glowstone_count",
                          Integer.toString(AnchorBindConfig.getGlowstoneCount())
                  );
              }

              private static Text getRestoreSlotText() {
                  if (AnchorBindConfig.isRestorePreviousSlot()) {
                      return Text.translatable("screen.anchorbind.config.restore_slot_on").formatted(Formatting.GREEN);
                  }
                  return Text.translatable("screen.anchorbind.config.restore_slot_off").formatted(Formatting.RED);
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  super.render(context, mouseX, mouseY, delta);

                  int centerX = this.width / 2;
                  int titleY = this.height / 2 - 84;

                  context.drawCenteredTextWithShadow(this.textRenderer, this.title, centerX, titleY, 0xFFFFFF);

                  Text credit = Text.translatable("screen.anchorbind.config.credit").formatted(Formatting.DARK_GRAY);
                  context.drawCenteredTextWithShadow(this.textRenderer, credit, centerX, this.height - 16, 0x808080);
              }

              @Override
              public void close() {
                  AnchorBindConfig.save();
                  if (this.client != null) {
                      this.client.setScreen(this.parent);
                  }
              }

              private static final class ComboSpeedSlider extends SliderWidget {

                  ComboSpeedSlider(int x, int y, int width, int height, double currentSeconds) {
                      super(x, y, width, height, Text.empty(), toNormalizedValue(currentSeconds));
                      this.updateMessage();
                  }

                  private static double toNormalizedValue(double seconds) {
                      double clamped = Math.max(AnchorBindConfig.MIN_SPEED_SECONDS, Math.min(AnchorBindConfig.MAX_SPEED_SECONDS, seconds));
                      return (clamped - AnchorBindConfig.MIN_SPEED_SECONDS)
                              / (AnchorBindConfig.MAX_SPEED_SECONDS - AnchorBindConfig.MIN_SPEED_SECONDS);
                  }

                  private double toSeconds() {
                      double raw = AnchorBindConfig.MIN_SPEED_SECONDS
                              + this.value * (AnchorBindConfig.MAX_SPEED_SECONDS - AnchorBindConfig.MIN_SPEED_SECONDS);
                      return Math.round(raw * 10.0D) / 10.0D;
                  }

                  @Override
                  protected void updateMessage() {
                      String formatted = String.format(Locale.ROOT, "%.1f", toSeconds());
                      this.setMessage(Text.translatable("screen.anchorbind.config.combo_speed", formatted));
                  }

                  @Override
                  protected void applyValue() {
                      AnchorBindConfig.setComboSpeedSeconds(toSeconds());
                  }
              }
          }
