          cat << 'EOF' > src/main/java/com/ahmad/cartbind/config/CartBindConfigScreen.java
          package com.ahmad.cartbind.config;

          import com.ahmad.cartbind.CartBindClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.screen.option.KeybindsScreen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.SliderWidget;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.screen.ScreenTexts;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;

          import java.util.Locale;

          public final class CartBindConfigScreen extends Screen {
              private final Screen parent;

              private ButtonWidget enabledButton;
              private PlacementSpeedSlider speedSlider;
              private ButtonWidget railPrefButton;
              private ButtonWidget restoreSlotButton;

              public CartBindConfigScreen(Screen parent) {
                  super(Text.translatable("screen.cartbind.config.title"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  int buttonWidth = 230;
                  int buttonHeight = 20;
                  int centerX = this.width / 2 - buttonWidth / 2;
                  int startY = this.height / 2 - 70;

                  this.enabledButton = this.addDrawableChild(ButtonWidget.builder(getEnabledText(), button -> {
                      CartBindConfig.toggleEnabled();
                      button.setMessage(getEnabledText());
                  }).dimensions(centerX, startY, buttonWidth, buttonHeight).build());

                  this.speedSlider = this.addDrawableChild(new PlacementSpeedSlider(
                          centerX,
                          startY + 24,
                          buttonWidth,
                          buttonHeight,
                          CartBindConfig.getPlacementSpeedSeconds()
                  ));

                  this.railPrefButton = this.addDrawableChild(ButtonWidget.builder(getRailPrefText(), button -> {
                      CartBindConfig.toggleRailPreference();
                      button.setMessage(getRailPrefText());
                  }).dimensions(centerX, startY + 48, buttonWidth, buttonHeight).build());

                  this.restoreSlotButton = this.addDrawableChild(ButtonWidget.builder(getRestoreSlotText(), button -> {
                      CartBindConfig.toggleRestorePreviousSlot();
                      button.setMessage(getRestoreSlotText());
                  }).dimensions(centerX, startY + 72, buttonWidth, buttonHeight).build());

                  KeyBinding kb = CartBindClient.getPlaceCartKeyBinding();
                  Text boundKey = kb != null ? kb.getBoundKeyLocalizedText() : Text.literal("G");
                  this.addDrawableChild(ButtonWidget.builder(
                          Text.translatable("screen.cartbind.config.open_controls", boundKey),
                          button -> {
                              if (this.client != null) {
                                  this.client.setScreen(new KeybindsScreen(this, this.client.options));
                              }
                          }
                  ).dimensions(centerX, startY + 96, buttonWidth, buttonHeight).build());

                  this.addDrawableChild(ButtonWidget.builder(
                          Text.translatable("screen.cartbind.config.reset_defaults"),
                          button -> {
                              CartBindConfig.resetToDefaults();
                              refreshWidgets();
                          }
                  ).dimensions(centerX, startY + 120, buttonWidth, buttonHeight).build());

                  this.addDrawableChild(ButtonWidget.builder(ScreenTexts.DONE, button -> close())
                          .dimensions(centerX, startY + 148, buttonWidth, buttonHeight)
                          .build());
              }

              private void refreshWidgets() {
                  if (this.enabledButton != null) {
                      this.enabledButton.setMessage(getEnabledText());
                  }
                  if (this.speedSlider != null) {
                      this.speedSlider.setFromSeconds(CartBindConfig.getPlacementSpeedSeconds());
                  }
                  if (this.railPrefButton != null) {
                      this.railPrefButton.setMessage(getRailPrefText());
                  }
                  if (this.restoreSlotButton != null) {
                      this.restoreSlotButton.setMessage(getRestoreSlotText());
                  }
              }

              private static Text getEnabledText() {
                  if (CartBindConfig.isEnabled()) {
                      return Text.translatable("screen.cartbind.config.enabled_on").formatted(Formatting.GREEN);
                  }
                  return Text.translatable("screen.cartbind.config.enabled_off").formatted(Formatting.RED);
              }

              private static Text getRailPrefText() {
                  if (CartBindConfig.getRailPreference() == CartBindConfig.RailPreference.STANDARD_FIRST) {
                      return Text.translatable("screen.cartbind.config.rail_pref_standard");
                  }
                  return Text.translatable("screen.cartbind.config.rail_pref_any");
              }

              private static Text getRestoreSlotText() {
                  if (CartBindConfig.isRestorePreviousSlot()) {
                      return Text.translatable("screen.cartbind.config.restore_slot_on").formatted(Formatting.GREEN);
                  }
                  return Text.translatable("screen.cartbind.config.restore_slot_off").formatted(Formatting.RED);
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  super.render(context, mouseX, mouseY, delta);

                  int centerX = this.width / 2;
                  int titleY = this.height / 2 - 92;

                  context.drawCenteredTextWithShadow(this.textRenderer, this.title, centerX, titleY, 0xFFFFFF);

                  Text credit = Text.translatable("screen.cartbind.config.credit").formatted(Formatting.DARK_GRAY);
                  context.drawCenteredTextWithShadow(this.textRenderer, credit, centerX, this.height - 15, 0x808080);
              }

              @Override
              public void close() {
                  CartBindConfig.save();
                  if (this.client != null) {
                      this.client.setScreen(this.parent);
                  }
              }

              private static final class PlacementSpeedSlider extends SliderWidget {

                  PlacementSpeedSlider(int x, int y, int width, int height, double currentSeconds) {
                      super(x, y, width, height, Text.empty(), toNormalizedValue(currentSeconds));
                      this.updateMessage();
                  }

                  void setFromSeconds(double seconds) {
                      this.value = toNormalizedValue(seconds);
                      this.updateMessage();
                  }

                  private static double toNormalizedValue(double seconds) {
                      double clamped = Math.max(CartBindConfig.MIN_SPEED_SECONDS, Math.min(CartBindConfig.MAX_SPEED_SECONDS, seconds));
                      return (clamped - CartBindConfig.MIN_SPEED_SECONDS)
                              / (CartBindConfig.MAX_SPEED_SECONDS - CartBindConfig.MIN_SPEED_SECONDS);
                  }

                  private double toSeconds() {
                      double raw = CartBindConfig.MIN_SPEED_SECONDS
                              + this.value * (CartBindConfig.MAX_SPEED_SECONDS - CartBindConfig.MIN_SPEED_SECONDS);
                      return Math.round(raw * 10.0D) / 10.0D;
                  }

                  @Override
                  protected void updateMessage() {
                      String formatted = String.format(Locale.ROOT, "%.1f", toSeconds());
                      this.setMessage(Text.translatable("screen.cartbind.config.placement_speed", formatted));
                  }

                  @Override
                  protected void applyValue() {
                      CartBindConfig.setPlacementSpeedSeconds(toSeconds());
                  }
              }
          }
